<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1d4f4a">
    <meta name="description" content="画像上の2点間距離をpxとmmで測定するオフライン対応PWA">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
    <title>画像距離測定</title>
    <link rel="stylesheet" href="./styles.css?v=2">
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">IMAGE SCALE TOOL</p>
          <h1>画像距離測定</h1>
        </div>
        <div id="saveStatus" class="save-status" aria-live="polite">端末に保存</div>
      </header>

      <main class="workspace">
        <aside class="control-panel" aria-label="画像と測定の設定">
          <section class="control-section image-section">
            <div class="section-heading">
              <h2>画像</h2>
              <button id="clearAll" class="icon-button danger" type="button" title="画像と設定を消去" aria-label="画像と設定を消去">
                <span aria-hidden="true">×</span>
              </button>
            </div>

            <div class="image-control">
              <div class="image-control-row">
                <span class="layer-dot layer-one" aria-hidden="true"></span>
                <strong>画像1</strong>
                <label class="file-button" for="imageInput1">選択</label>
                <input id="imageInput1" class="visually-hidden" type="file" accept="image/*">
              </div>
              <div id="imageName1" class="file-name">未選択</div>
              <label class="range-label" for="opacity1">
                <span>透明度</span><output id="opacityValue1">100%</output>
              </label>
              <input id="opacity1" type="range" min="0" max="100" value="100">
            </div>

            <div class="image-control">
              <div class="image-control-row">
                <span class="layer-dot layer-two" aria-hidden="true"></span>
                <strong>画像2</strong>
                <label class="file-button" for="imageInput2">選択</label>
                <input id="imageInput2" class="visually-hidden" type="file" accept="image/*">
              </div>
              <div id="imageName2" class="file-name">未選択</div>
              <label class="range-label" for="opacity2">
                <span>透明度</span><output id="opacityValue2">55%</output>
              </label>
              <input id="opacity2" type="range" min="0" max="100" value="55">
            </div>
          </section>

          <section class="control-section">
            <h2>モード</h2>
            <div class="segmented-control" role="group" aria-label="操作モード">
              <button class="mode-button active" type="button" data-mode="measure">測定</button>
              <button class="mode-button" type="button" data-mode="reference">基準線</button>
              <button class="mode-button" type="button" data-mode="align">位置合わせ</button>
            </div>
            <p id="modeHelp" class="mode-help">画像上の始点と終点を順に指定します。</p>
          </section>

          <section class="control-section">
            <div class="section-heading">
              <h2>基準設定</h2>
              <button id="clearLines" class="text-button" type="button">線を消去</button>
            </div>
            <label class="number-label" for="referenceMm">
              <span>基準線の実寸</span>
              <span class="number-field"><input id="referenceMm" type="number" min="0.001" step="any" value="50" inputmode="decimal"><span>mm</span></span>
            </label>
            <button id="resetImage2" class="secondary-button" type="button">画像2の位置を中央に戻す</button>
          </section>

          <section class="control-section view-controls">
            <h2>表示</h2>
            <div class="view-button-row">
              <button id="zoomOut" class="icon-button" type="button" title="縮小" aria-label="縮小">−</button>
              <output id="zoomValue" aria-label="ズーム倍率">100%</output>
              <button id="zoomIn" class="icon-button" type="button" title="拡大" aria-label="拡大">＋</button>
              <button id="fitView" class="secondary-button compact" type="button">全体表示</button>
            </div>
          </section>
        </aside>

        <section class="canvas-panel" aria-label="画像測定キャンバス">
          <div id="canvasStage" class="canvas-stage">
            <canvas id="measurementCanvas"></canvas>
            <div id="emptyState" class="empty-state">
              <strong>画像を選択</strong>
              <span>画像1または画像2を読み込むと測定を開始できます</span>
            </div>
          </div>
          <div class="canvas-status">
            <span id="pointerPosition">x: — / y: —</span>
            <span id="alignmentPosition">画像2: x 0px / y 0px</span>
          </div>
        </section>
      </main>

      <footer class="result-bar" aria-live="polite">
        <div class="result-item">
          <span>測定距離</span>
          <strong id="pixelResult">— px</strong>
        </div>
        <div class="result-divider" aria-hidden="true"></div>
        <div class="result-item">
          <span>実寸</span>
          <strong id="millimeterResult">基準線を設定</strong>
        </div>
        <div id="referenceResult" class="reference-summary">基準: 未設定</div>
      </footer>
    </div>

    <script type="module" src="./app.js?v=2"></script>
  </body>
</html>
